name: verify-release

on:
  push:
  pull_request:

jobs:
  compact-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install numpy==2.2.6 pandas==2.3.3
      - run: python scripts/verify_release.py
